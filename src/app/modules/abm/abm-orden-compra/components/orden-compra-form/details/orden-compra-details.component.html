<div *ngIf="isResizing" class="resizer-overlay"
    [style.cursor]="splitDirection === 'row' ? 'col-resize' : 'row-resize'">
</div>

<div #splitContainer class="flex flex-auto h-full overflow-hidden">
    <div class="flex flex-auto h-full w-full" [ngClass]="splitDirection === 'row' ? 'flex-row' : 'flex-col'">

        <div class="bg-gray-800 relative overflow-hidden flex-shrink-0 group"
            [style.width.%]="splitDirection === 'row' ? splitSize : 100"
            [style.height.%]="splitDirection === 'column' ? splitSize : 100">

            <iframe *ngIf="pdfPreviewUrl && !isImagePreview" [src]="pdfPreviewUrl" class="w-full h-full border-none"></iframe>
            
            <ng-container *ngIf="pdfPreviewUrl && isImagePreview">
                <div class="w-full h-full overflow-hidden flex items-center justify-center cursor-grab active:cursor-grabbing bg-gray-900"
                     (wheel)="onImageWheel($event)"
                     (mousedown)="onImageMouseDown($event)">
                    <img [src]="pdfPreviewUrl" 
                          class="max-w-none transition-transform duration-75 origin-center pointer-events-none"
                          [style.transform]="'translate(' + imagePanX + 'px, ' + imagePanY + 'px) scale(' + imageZoom + ') rotate(' + imageRotation + 'deg)'">
                </div>
                
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-gray-800/80 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <button mat-icon-button (click)="zoomOutImage()" matTooltip="Alejar" class="text-white">
                        <mat-icon svgIcon="heroicons_outline:zoom-out"></mat-icon>
                    </button>
                    <span class="text-white/80 font-mono text-xs w-12 text-center">{{ imageZoomPercent }}</span>
                    <button mat-icon-button (click)="zoomInImage()" matTooltip="Acercar" class="text-white">
                        <mat-icon svgIcon="heroicons_outline:zoom-in"></mat-icon>
                    </button>
                    <div class="w-px h-6 bg-white/20 mx-1"></div>
                    <button mat-icon-button (click)="rotateImageLeft()" matTooltip="Rotar Izquierda" class="text-white">
                        <mat-icon style="transform: scaleX(-1);" svgIcon="heroicons_outline:refresh"></mat-icon>
                    </button>
                    <button mat-icon-button (click)="rotateImageRight()" matTooltip="Rotar Derecha" class="text-white">
                        <mat-icon svgIcon="heroicons_outline:refresh"></mat-icon>
                    </button>
                    <div class="w-px h-6 bg-white/20 mx-1"></div>
                    <button mat-icon-button (click)="resetImageView()" matTooltip="Restablecer" class="text-white">
                        <mat-icon svgIcon="heroicons_outline:arrows-expand"></mat-icon>
                    </button>
                </div>
            </ng-container>
        </div>

        <div class="resizer-gutter" [ngClass]="splitDirection === 'row' ? 'horizontal' : 'vertical'"
            (mousedown)="startResizing($event)">
        </div>

        <div class="flex flex-col overflow-hidden bg-gray-100/50 flex-auto"
            [style.width.%]="splitDirection === 'row' ? (100 - splitSize) : 100"
            [style.height.%]="splitDirection === 'column' ? (100 - splitSize) : 100">

            <ng-container *ngIf="mode === 'view'">
                <app-orden-compra-piezas-list 
                    class="h-full"
                    [piezasAgregadas]="piezasAgregadas"
                    [mode]="mode"
                    (piecesChanged)="piecesChanged.emit($event)">
                </app-orden-compra-piezas-list>
            </ng-container>

            <ng-container *ngIf="mode !== 'view'">
                <mat-tab-group class="h-full flex flex-col abm-tabs" [selectedIndex]="activeTabIndex" (selectedIndexChange)="activeTabIndex = $event">
                    <mat-tab>
                        <ng-template mat-tab-label>
                            <div class="flex items-center gap-2 transition-colors duration-200"
                                [ngClass]="{'text-primary': activeTabIndex === 0, 'text-gray-500': activeTabIndex !== 0}">
                                <mat-icon svgIcon="heroicons_outline:cube" class="icon-size-5"></mat-icon>
                                <span class="font-bold text-sm tracking-wide">Cargar Piezas</span>
                            </div>
                        </ng-template>
                        <div class="h-full overflow-hidden">
                            <app-orden-compra-pieza-form
                                [form]="form"
                                [piezaForm]="piezaForm"
                                [piezasAgregadas]="piezasAgregadas"
                                [mode]="mode"
                                (piecesChanged)="piecesChanged.emit($event)">
                            </app-orden-compra-pieza-form>
                        </div>
                    </mat-tab>

                    <mat-tab>
                        <ng-template mat-tab-label>
                            <div class="flex items-center gap-2 transition-colors duration-200"
                                [ngClass]="{'text-primary': activeTabIndex === 1, 'text-gray-500': activeTabIndex !== 1}">
                                <mat-icon svgIcon="heroicons_outline:shopping-bag" class="icon-size-5"></mat-icon>
                                <span class="font-bold text-sm tracking-wide">Piezas Agregadas</span>
                                <span class="flex items-center justify-center bg-primary text-white text-xs font-bold rounded-full min-w-5 h-5 px-1.5 shadow-sm">
                                    {{ piezasAgregadas.length }}
                                </span>
                            </div>
                        </ng-template>
                        <div class="h-full overflow-hidden">
                            <app-orden-compra-piezas-list
                                [piezasAgregadas]="piezasAgregadas"
                                [mode]="mode"
                                (piecesChanged)="piecesChanged.emit($event)"
                                (selectPiece)="onSelectPiece($event)">
                            </app-orden-compra-piezas-list>
                        </div>
                    </mat-tab>
                </mat-tab-group>
            </ng-container>

        </div>
    </div>
</div>
