<div class="flex flex-col flex-auto min-w-0 h-full overflow-hidden relative">
    <div *ngIf="isInitialLoading"
        class="absolute inset-0 bg-white/60 backdrop-blur-sm z-[999] flex flex-col items-center justify-center animate-in fade-in duration-300">
        <mat-progress-spinner mode="indeterminate" color="primary" diameter="60"></mat-progress-spinner>
        <p class="mt-4 text-primary font-bold tracking-widest uppercase text-xs animate-pulse">Cargando datos...</p>
    </div>

    <div *ngIf="step === 'header'" class="flex flex-col items-center p-6 h-full overflow-y-auto bg-gray-50">
        <app-orden-compra-header 
            [form]="form" 
            [mode]="mode" 
            [isInitialLoading]="isInitialLoading"
            (fileSelectedEvent)="onFileSelected($event)">
        </app-orden-compra-header>
    </div>

    <div *ngIf="step === 'items'" class="flex flex-auto h-full overflow-hidden">
        <app-orden-compra-details 
            [form]="form"
            [mode]="mode" 
            [piezaForm]="piezaForm" 
            [piezasAgregadas]="piezasAgregadas"
            [pdfPreviewUrl]="pdfPreviewUrl"
            [isImagePreview]="isImagePreview" 
            (piecesChanged)="onPiecesChanged($event)">
        </app-orden-compra-details>
    </div>
</div>
