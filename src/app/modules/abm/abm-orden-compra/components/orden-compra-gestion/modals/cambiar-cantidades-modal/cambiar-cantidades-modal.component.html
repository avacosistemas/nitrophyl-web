<div class="flex flex-col gap-3 pt-2">
    <div class="text-xs text-gray-600 bg-gray-50 border border-gray-200 rounded-xl p-3">
        <span class="font-bold text-gray-700">Ítem:</span> {{ grupo?.denominacion || grupo?.pieza }}
        <span *ngIf="batch?.fechaEntrega" class="ml-2">
            | <span class="font-bold text-gray-700">Entrega:</span> {{ batch?.fechaEntrega }}
        </span>
    </div>

    <form [formGroup]="form" class="flex flex-col gap-3 mt-1">
        <div class="grid grid-cols-2 gap-4">
            <mat-form-field appearance="outline">
                <mat-label>Cantidad Actual</mat-label>
                <input matInput [value]="batch?.cantidadSolicitada" disabled class="font-bold text-center">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Nueva Cantidad</mat-label>
                <input matInput type="number" formControlName="nuevaCantidad" min="1" class="font-bold text-center">
                <mat-error *ngIf="form.get('nuevaCantidad')?.hasError('required')">Requerido</mat-error>
                <mat-error *ngIf="form.get('nuevaCantidad')?.hasError('min')">Mínimo 1</mat-error>
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Motivo del cambio de cantidad</mat-label>
            <textarea matInput formControlName="motivo" rows="3" placeholder="Indique la razón del cambio de cantidades..."></textarea>
            <mat-error *ngIf="form.get('motivo')?.hasError('required')">El motivo es obligatorio</mat-error>
            <mat-error *ngIf="form.get('motivo')?.hasError('minlength')">Debe ingresar al menos 5 caracteres</mat-error>
        </mat-form-field>
    </form>
</div>
