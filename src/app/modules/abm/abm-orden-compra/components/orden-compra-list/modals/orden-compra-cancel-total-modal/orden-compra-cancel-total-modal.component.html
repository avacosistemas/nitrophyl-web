<div class="flex flex-col gap-4">
    <div class="p-3 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3">
        <mat-icon class="text-red-500 mt-0.5 shrink-0" svgIcon="heroicons_outline:exclamation"></mat-icon>
        <div class="text-sm text-red-700 leading-relaxed">
            <strong>ADVERTENCIA:</strong> Esta acción cancelará por completo la Orden de Compra <strong>{{ comprobante }}</strong>. Esta es una operación <strong>destructiva</strong> y no se podrá revertir.
        </div>
    </div>

    <form [formGroup]="form">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Motivo de cancelación</mat-label>
            <textarea matInput formControlName="motivo" rows="4" placeholder="Explique detalladamente el motivo de la cancelación..."></textarea>
            <mat-error *ngIf="form.get('motivo')?.hasError('required')">El motivo es obligatorio</mat-error>
            <mat-error *ngIf="form.get('motivo')?.hasError('minlength')">Debe ingresar al menos 5 caracteres</mat-error>
        </mat-form-field>
    </form>
</div>
