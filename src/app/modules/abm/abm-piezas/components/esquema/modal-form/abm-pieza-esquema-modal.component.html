<div mat-dialog-content class="px-0 relative">
    <div *ngIf="isLoading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10">
        <mat-progress-spinner mode="indeterminate" [diameter]="50"></mat-progress-spinner>
    </div>
    <form [formGroup]="formEsquema" class=" mat-form-without-wrapper">
        <mat-tab-group>
            <mat-tab label="Datos Generales">
                <div class="flex flex-col gap-2">
                    <mat-form-field appearance="outline" class="w-full">
                        <mat-label>Título</mat-label>
                        <input matInput formControlName="titulo" required>
                        <mat-error *ngIf="formEsquema.get('titulo').hasError('required')">El título es
                            requerido</mat-error>
                    </mat-form-field>

                    <div
                        class="flex flex-col items-center justify-center relative p-6 border-2 border-dashed rounded-xl bg-gray-50 hover:bg-gray-100/70 transition-all cursor-pointer group"
                        [ngClass]="{
                            'border-primary bg-blue-50/50 scale-[1.01]': isDragging,
                            'border-gray-300 hover:border-primary': !isDragging
                        }"
                        (click)="fileInput.click()"
                        (dragover)="onDragOver($event)"
                        (dragenter)="onDragOver($event)"
                        (dragleave)="onDragLeave($event)"
                        (drop)="onDrop($event)">
                        <input #fileInput id="file-upload" type="file" class="sr-only" accept="image/*"
                            (change)="onFileSelected($event)">

                        <div *ngIf="!safeImageUrl" class="flex flex-col items-center justify-center text-center py-4">
                            <div class="w-14 h-14 rounded-full bg-blue-50 text-primary flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                <mat-icon class="text-primary text-3xl h-8 w-8 leading-none" svgIcon="heroicons_solid:upload"></mat-icon>
                            </div>
                            <span class="text-base font-medium text-gray-700">Seleccionar imagen</span>
                            <span class="text-sm text-gray-500 mt-1">Haz clic o arrastra un archivo aquí (PNG, JPG)</span>
                        </div>

                        <div *ngIf="safeImageUrl" class="flex flex-col items-center justify-center text-center w-full">
                            <div class="relative bg-white p-2 rounded-lg border border-gray-200 shadow-sm mb-3">
                                <img [src]="safeImageUrl" class="object-contain rounded"
                                    style="max-width: 140px; max-height: 120px;">
                            </div>

                            <span class="text-xs font-semibold text-green-700 bg-green-50 px-2.5 py-1 rounded-full border border-green-200 mb-2 max-w-xs truncate" *ngIf="selectedFile">
                                {{ selectedFile?.name }}
                            </span>

                            <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-white border border-gray-300 text-gray-700 shadow-xs group-hover:border-primary group-hover:text-primary transition-colors">
                                <mat-icon class="text-base h-4 w-4 leading-none" svgIcon="heroicons_solid:upload"></mat-icon>
                                <span class="text-xs sm:text-sm font-medium">
                                    Haz clic para cambiar la imagen
                                </span>
                            </div>
                            <span class="text-sm text-gray-400 mt-1">o arrastra una nueva imagen aquí</span>
                        </div>

                        <button *ngIf="safeImageUrl" type="button" mat-icon-button
                            class="absolute top-2 right-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors"
                            (click)="removeSelectedFile($event)" matTooltip="Eliminar imagen">
                            <mat-icon svgIcon="heroicons_solid:trash"></mat-icon>
                        </button>
                    </div>
                </div>
            </mat-tab>

            <mat-tab label="Pasos">
                <div class="flex flex-col gap-2 p-4">
                    <div formArrayName="pasos" cdkDropList (cdkDropListDropped)="drop($event)">
                        <div *ngFor="let pasoGroup of pasosFormArray.controls; let i = index" [formGroup]="pasoGroup"
                            cdkDrag class="flex items-start gap-2 bg-white mb-2 p-2 border rounded shadow-sm">
                            <div class="cursor-move" cdkDragHandle>
                                <mat-icon class="text-gray-400">reorder</mat-icon>
                            </div>
                            <mat-form-field appearance="outline" class="w-full">
                                <mat-label>Paso {{ i + 1 }}</mat-label>
                                <input type="text" matInput formControlName="descripcion" required>
                                <mat-error *ngIf="pasoGroup.get('descripcion').hasError('required')">Este paso es
                                    requerido</mat-error>
                            </mat-form-field>
                            <button mat-icon-button type="button" (click)="quitarPaso(i)" class="mt-3">
                                <mat-icon>remove_circle_outline</mat-icon>
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-center mt-2">
                        <button mat-flat-button (click)="agregarPaso()"
                            class="mat-focus-indicator mat-flat-button mat-button-base mat-accent min-w-max w-full max-w-30">
                            <span class="mat-button-wrapper">
                                Añadir Paso
                            </span>
                        </button>
                    </div>
                </div>
            </mat-tab>
        </mat-tab-group>
    </form>
</div>

<div mat-dialog-actions class="justify-end">
    <div class="flex shrink-0 items-center gap-2 flex-row-reverse">
        <button mat-flat-button (click)="onSave()" [disabled]="formEsquema.invalid || isLoading"
            class="mat-focus-indicator mat-flat-button mat-button-base mat-accent min-w-max w-full max-w-30">
            <span class="mat-button-wrapper">
                Guardar
            </span>
        </button>

        <button mat-stroked-button (click)="onCancel()"
            class="mat-focus-indicator mat-stroked-button mat-button-base min-w-max w-full max-w-30">
            <span class="mat-button-wrapper"> Cancelar </span>
        </button>
    </div>
</div>
