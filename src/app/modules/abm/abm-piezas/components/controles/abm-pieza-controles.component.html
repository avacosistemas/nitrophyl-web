<div>
  <form [formGroup]="controlForm" (ngSubmit)="addOrUpdateControl()" class="w-full mat-form-without-wrapper"
    *ngIf="mode !== 'view'">

    <div class="flex flex-wrap items-center gap-3">
      <mat-form-field class="flex-1" appearance="outline">
        <mat-label>Descripción del Control</mat-label>
        <input matInput placeholder="Descripción" formControlName="control">
      </mat-form-field>

      <div class="flex gap-2 items-center pb-4">
        <button mat-flat-button color="accent" type="submit" [disabled]="controlForm.invalid || isLoading">
          {{buttonText}}
        </button>
        <button mat-stroked-button type="button" (click)="cancelEdit()" *ngIf="editMode" [disabled]="isLoading">
          Cancelar
        </button>
      </div>
    </div>

  </form>

  <div class="relative mt-4">
    <div *ngIf="isLoading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10">
      <mat-progress-spinner mode="indeterminate" [diameter]="50"></mat-progress-spinner>
    </div>
    <table mat-table [dataSource]="controles" class="border-2 rounded-2xl w-full">

      <ng-container matColumnDef="control">
        <th mat-header-cell *matHeaderCellDef> Control </th>
        <td mat-cell *matCellDef="let element"> {{element.control}} </td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let element"> {{element.tipo}} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="flex gap-2 justify-end items-center" *ngIf="row.tipo === 'GENERAL'">
            <ng-container *ngIf="mode !== 'view'">
              <mat-icon (click)="startEdit(row)" svgIcon="heroicons_solid:pencil-alt" class="cursor-pointer"
                matTooltip="Editar"></mat-icon>
              <mat-icon (click)="eliminarControl(row)" svgIcon="heroicons_solid:trash" class="cursor-pointer"
                matTooltip="Eliminar"></mat-icon>
            </ng-container>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumnsControles"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumnsControles;"></tr>
      <tr *matNoDataRow>
        <td class="text-center py-4" [attr.colspan]="displayedColumnsControles.length" *ngIf="sinDatos && !isLoading">
          No hay controles asociados a esta pieza.</td>
      </tr>
    </table>
  </div>
</div>
