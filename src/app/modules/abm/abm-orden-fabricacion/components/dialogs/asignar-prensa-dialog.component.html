<h2 mat-dialog-title class="font-bold text-gray-800">Asignar Orden de Fabricación</h2>

<mat-dialog-content [formGroup]="form" class="flex flex-col gap-6 pt-2 pb-4">
    <div class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Sector</mat-label>
            <input type="text" placeholder="Buscar y seleccionar un sector..." matInput formControlName="sector"
                [matAutocomplete]="autoSector" #sectorTrigger="matAutocompleteTrigger"
                (focus)="sectorTrigger.openPanel()" (click)="sectorTrigger.openPanel()" required>
            <button *ngIf="form.get('sector').value" matSuffix mat-icon-button aria-label="Clear"
                (click)="clearControl('sector'); $event.stopPropagation()">
                <mat-icon class="icon-size-5">close</mat-icon>
            </button>
            <mat-autocomplete #autoSector="matAutocomplete" [displayWith]="displayFnSector">
                <mat-option *ngFor="let s of filteredSectores$ | async" [value]="s">
                    {{ s.nombre }}
                </mat-option>
            </mat-autocomplete>
            <mat-error *ngIf="form.get('sector').hasError('required')">
                El sector es requerido.
            </mat-error>
            <mat-error *ngIf="form.get('sector').hasError('mustSelectOption')">
                Debe seleccionar un sector de la lista.
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Máquina</mat-label>
            <input type="text" placeholder="Buscar y seleccionar una máquina..." matInput formControlName="maquina"
                [matAutocomplete]="autoMaquina" #maquinaTrigger="matAutocompleteTrigger"
                (focus)="maquinaTrigger.openPanel()" (click)="maquinaTrigger.openPanel()">
            <button *ngIf="form.get('maquina').value" matSuffix mat-icon-button aria-label="Clear"
                (click)="clearControl('maquina'); $event.stopPropagation()">
                <mat-icon class="icon-size-5">close</mat-icon>
            </button>
            <mat-autocomplete #autoMaquina="matAutocomplete" [displayWith]="displayFnMaquina">
                <mat-option *ngFor="let m of filteredMaquinas$ | async" [value]="m">
                    {{ m.nombre }}
                </mat-option>
            </mat-autocomplete>
            <mat-hint *ngIf="form.get('maquina').disabled" class="text-xs text-gray-400">Seleccione un sector para habilitar</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Operario</mat-label>
            <input type="text" placeholder="Buscar y seleccionar un operario..." matInput formControlName="operario"
                [matAutocomplete]="autoOperario" #operarioTrigger="matAutocompleteTrigger"
                (focus)="operarioTrigger.openPanel()" (click)="operarioTrigger.openPanel()">
            <button *ngIf="form.get('operario').value" matSuffix mat-icon-button aria-label="Clear"
                (click)="clearControl('operario'); $event.stopPropagation()">
                <mat-icon class="icon-size-5">close</mat-icon>
            </button>
            <mat-autocomplete #autoOperario="matAutocomplete" [displayWith]="displayFnOperario">
                <mat-option *ngFor="let o of filteredOperarios$ | async" [value]="o">
                    {{ o.nombre }}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-6">
    <button mat-button mat-dialog-close class="mr-2">Cancelar</button>
    <button mat-flat-button color="accent" [disabled]="form.invalid" class="rounded-full px-6" (click)="save()">
        Asignar
    </button>
</mat-dialog-actions>
